services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: priceprojections-backend
    restart: unless-stopped
    expose:
      - "5000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: priceprojections-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      - backend
